name: eira
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Persistencia local clave-valor. Única vía de almacenamiento de la app
  # (PLAN_MAESTRO §22); solo lib/core/storage/ la importa (regla E4).
  # Elección del paquete, alternativas descartadas (hive, sqflite, archivos
  # planos) y consecuencias en ADR-004; la forma de la API, en ADR-009.
  shared_preferences: ^2.5.5

  # Enrutado declarativo. Sostiene el shell de 5 pestañas y el mapa de rutas del
  # PLAN_MAESTRO §23; el §19 ya lo da por adoptado.
  # La 18.0.0 movió las transiciones y la pantalla de error internas a los
  # paquetes material_ui / cupertino_ui, que traen su propia copia de Material:
  # por eso la app declara `builder:` y `errorBuilder:` propios y nunca
  # `pageBuilder:`. Decisión, alternativas y consecuencias en ADR-010.
  go_router: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Genera las capas del ícono adaptativo de Android a partir del isotipo.
  # Es dependencia de DESARROLLO: no se compila en el APK, no ejecuta código en
  # el dispositivo y no abre superficie de red (§14). Decisión, alternativas
  # descartadas (ícono por defecto de Flutter, generar las ~16 capas a mano) y
  # consecuencias en ADR-012.
  # Los archivos que produce bajo android/app/src/main/res/ SE REGENERAN CON EL
  # COMANDO, NUNCA SE EDITAN A MANO.
  flutter_launcher_icons: ^0.14.4

# Configuración del generador de íconos (ADR-012). Se aplica con:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false

  # Recurso heredado. Con minSdk 26 ningún dispositivo soportado por EIRA llega
  # a mostrarlo —todos usan la vía adaptativa—, pero Android lo exige como
  # reserva.
  image_path: "assets/branding/eira_isotype.webp"

  # Color de marca exacto = AppColors.sage400 (lib/core/theme/app_colors.dart).
  # No es un valor nuevo: es el token medido en T-004, registrado en
  # docs/accessibility/contrast-verification.md y fijado por ADR-008, que le
  # asigna el rol de "superficie grande sin texto encima".
  # Duplicar el hexadecimal aquí es la consecuencia negativa principal de
  # ADR-012: el formato de configuración es YAML y no puede leer Dart. Si el
  # token cambia en app_colors.dart, HAY QUE CAMBIARLO AQUÍ TAMBIÉN — no hay
  # herramienta que lo detecte.
  adaptive_icon_background: "#979F80"

  # La marca sobre transparencia, al 66 % del lienzo (zona segura del ícono
  # adaptativo). Derivada de eira_isotype.webp; ver ADR-012 y
  # docs/content/image-credits.md.
  adaptive_icon_foreground: "assets/branding/eira_isotype_mark.webp"

  # El generador aplica por defecto un inset del 16 %, que sobre una marca ya
  # dimensionada al 66 % la dejaría en el 45 % del lienzo: demasiado pequeña.
  # Con 8 %:  66 % × (1 − 0,16) = 55,4 % del lienzo de 108 dp, es decir ~83 %
  # del área visible de 72 dp. Es la proporción de la retícula de íconos de
  # producto de Material para una marca circular. Ver ADR-012.
  adaptive_icon_foreground_inset: 8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Imágenes de marca: isotipo, wordmark, la ilustración del consejo del día y
  # los cuatro íconos de categoría. Todas WebP y dentro del presupuesto del §7
  # (íconos ≤ 20 KB, ilustraciones ≤ 80 KB). Licencias registradas en
  # docs/content/image-credits.md, que es requisito para que entren (§25).
  assets:
    - assets/branding/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
